<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOB Hub - Universal Audio Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117; color: #c9d1d9;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; padding: 20px;
    }
    .card {
      background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 28px; width: 100%; max-width: 420px; text-align: center;
    }
    h1 { color: #58a6ff; margin-bottom: 8px; }
    p { color: #8b949e; font-size: 0.9rem; margin-bottom: 20px; }
    input[type="text"] {
      width: 100%; padding: 12px; border-radius: 6px;
      border: 1px solid #30363d; background: #0d1117; color: #fff;
      font-size: 1rem; margin-bottom: 12px; text-align: center;
    }
    button {
      width: 100%; padding: 12px; border-radius: 6px; border: none;
      background: #238636; color: #fff; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button:hover { background: #2ea043; }
    .status {
      margin-top: 16px; padding: 10px; background: #0d1117;
      border: 1px solid #21262d; border-radius: 6px; font-size: 0.85rem; color: #e3b341;
    }
    audio { width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>TOB Web Hub</h1>
    <p>Compatible con Safari, Chrome, iOS y Android</p>

    <input type="text" id="ipArduino" placeholder="Ej: 192.168.1.50">
    <button id="btnObtener">Obtener Último Audio</button>

    <div id="estado" class="status">Ingresa la IP que muestra el Monitor Serie</div>

    <audio id="reproductor" controls style="display: none;"></audio>
  </div>

  <script>
    const ipInput = document.getElementById('ipArduino');
    const btnObtener = document.getElementById('btnObtener');
    const estado = document.getElementById('estado');
    const reproductor = document.getElementById('reproductor');

    btnObtener.addEventListener('click', async () => {
      const ip = ipInput.value.trim();
      if (!ip) {
        estado.textContent = "Por favor ingresa la IP del Arduino.";
        return;
      }

      estado.textContent = "Descargando audio desde el Arduino...";
      const urlAudio = `http://${ip}/audio.wav`;

      try {
        reproductor.src = urlAudio;
        reproductor.style.display = 'block';
        await reproductor.play();
        estado.textContent = "▶️ Reproduciendo grabación...";
      } catch (e) {
        console.error(e);
        estado.textContent = "Error al conectar. Verifica que la IP sea correcta y estés en el mismo Wi-Fi.";
      }
    });
  </script>
</body>
</html>
