<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control TOB SKP - Asistente IA</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      margin: 0;
    }
    h1 { color: #00e676; font-size: 1.5rem; text-align: center; }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      margin-bottom: 15px;
      box-sizing: border-box;
    }
    button {
      background-color: #00e676;
      color: #000;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    button:disabled { background-color: #555; color: #888; }
    button.emergency { background-color: #ff5252; color: #fff; }
    .status { font-size: 0.9rem; color: #bbb; margin-top: 10px; }
    .log-box {
      background: #000;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 10px;
      height: 120px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      color: #00ff66;
    }
  </style>
</head>
<body>

  <h1>Control TOB SKP + IA</h1>

  <div class="card">
    <h3>1. Conexión Bluetooth</h3>
    <button id="btnConectar">Conectar a TOB SKP</button>
    <div class="status" id="estadoBLE">Estado: Desconectado</div>
  </div>

  <div class="card">
    <h3>2. API Key de IA (OpenAI / Gemini)</h3>
    <input type="password" id="apiKey" placeholder="Ingresa tu API Key de OpenAI" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box;">
  </div>

  <div class="card">
    <h3>3. Transcripción y Respuesta IA</h3>
    <div class="log-box" id="logBox">Esperando audio de TOB SKP...</div>
  </div>

  <div class="card" id="seccionAcciones">
    <h3>4. Acciones Detectadas</h3>
    <div id="resultadoAccion" style="margin-bottom: 10px; font-weight: bold;">Sin acciones pendientes</div>
    <button id="btnEmergencia" class="emergency" style="display: none;">🚨 Llamar a Emergencias (911)</button>
  </div>

  <script>
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

    let bluetoothDevice;
    let audioBuffer = [];

    const btnConectar = document.getElementById('btnConectar');
    const estadoBLE = document.getElementById('estadoBLE');
    const logBox = document.getElementById('logBox');
    const btnEmergencia = document.getElementById('btnEmergencia');
    const resultadoAccion = document.getElementById('resultadoAccion');

    function log(mensaje) {
      logBox.innerHTML += `<div>> ${mensaje}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // --- CONEXIÓN BLUETOOTH CON FILTRO "TOB SKP" ---
    btnConectar.addEventListener('click', async () => {
      try {
        log("Buscando dispositivo TOB SKP...");
        bluetoothDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'TOB SKP' }],
          optionalServices: [SERVICE_UUID]
        });

        const server = await bluetoothDevice.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', manejarDatosEntrantes);

        estadoBLE.innerText = "Estado: Conectado a TOB SKP";
        estadoBLE.style.color = "#00e676";
        btnConectar.disabled = true;
        log("Conectado con éxito. Presiona el botón del Arduino para grabar.");
      } catch (error) {
        log("Error de conexión: " + error);
      }
    });

    function manejarDatosEntrantes(event) {
      let value = event.target.value;
      let chunk = new Uint8Array(value.buffer);
      
      for (let i = 0; i < chunk.length; i++) {
        audioBuffer.push(chunk[i]);
      }

      log(`Recibiendo audio de TOB SKP... (${audioBuffer.length} bytes)`);

      clearTimeout(window.timeOutAudio);
      window.timeOutAudio = setTimeout(procesarAudioRecibido, 1000);
    }

    async function procesarAudioRecibido() {
      log(`Grabación recibida completa. Total: ${audioBuffer.length} bytes.`);
      const apiKey = document.getElementById('apiKey').value;

      if (!apiKey) {
        log("⚠️ Por favor ingresa una API Key para procesar la IA.");
        audioBuffer = [];
        return;
      }

      log("Enviando audio a la API de Inteligencia Artificial...");

      const rawData = new Uint8Array(audioBuffer);
      audioBuffer = [];

      const wavBlob = crearWavBlob(rawData, 8000);

      const formData = new FormData();
      formData.append("file", wavBlob, "audio.wav");
      formData.append("model", "whisper-1");

      try {
        const resWhisper = await fetch("https://api.openai.com/v1/audio/transcriptions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${apiKey}` },
          body: formData
        });
        const dataWhisper = await resWhisper.json();
        const textoTranscrit = dataWhisper.text;

        log(`📝 Transcripción: "${textoTranscrit}"`);

        analizarIntencionIA(textoTranscrit, apiKey);

      } catch (err) {
        log("Error al procesar audio: " + err);
      }
    }

    async function analizarIntencionIA(texto, apiKey) {
      try {
        const resLLM = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              {
                role: "system",
                content: "Eres un asistente de voz. Analiza el texto recibido. Si el usuario pide un recordatorio o tarea, responde en JSON: {\"tipo\": \"recordatorio\", \"detalle\": \"texto del recordatorio\"}. Si el usuario menciona una emergencia, peligro, accidente o ayuda urgente, responde en JSON: {\"tipo\": \"emergencia\"}. Responde ÚNICAMENTE en formato JSON."
              },
              { role: "user", content: texto }
            ]
          })
        });

        const dataLLM = await resLLM.json();
        const respuestaIA = JSON.parse(dataLLM.choices[0].message.content);

        if (respuestaIA.tipo === "emergencia") {
          resultadoAccion.innerText = "🚨 Alerta: Emergencia Detectada";
          resultadoAccion.style.color = "#ff5252";
          btnEmergencia.style.display = "block";
          
          window.location.href = "tel:911";

        } else if (respuestaIA.tipo === "recordatorio") {
          resultadoAccion.innerText = `📌 Recordatorio Creado: "${respuestaIA.detalle}"`;
          resultadoAccion.style.color = "#00e676";
          btnEmergencia.style.display = "none";

          if (Notification.permission === "granted") {
            new Notification("Nuevo Recordatorio", { body: respuestaIA.detalle });
          } else {
            Notification.requestPermission();
          }
        }
      } catch (e) {
        log("Error analizando intención: " + e);
      }
    }

    function crearWavBlob(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length);
      const view = new DataView(buffer);

      const writeString = (offset, string) => {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      };

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + samples.length, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate, true);
      view.setUint16(32, 1, true);
      view.setUint16(34, 8, true);
      writeString(36, 'data');
      view.setUint32(40, samples.length, true);

      for (let i = 0; i < samples.length; i++) {
        view.setUint8(44 + i, samples[i]);
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }
  </script>
</body>
</html>
