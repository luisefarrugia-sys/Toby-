<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOB SKP - Receptor de Audio BLE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: #58a6ff;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    p {
      color: #8b949e;
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .btn-ble {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn-ble:hover {
      background-color: #2ea043;
    }

    .btn-ble:active {
      transform: scale(0.98);
    }

    .btn-ble:disabled {
      background-color: #21262d;
      color: #484f58;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 20px;
      padding: 12px;
      background-color: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #e3b341;
      word-break: break-word;
    }

    audio {
      margin-top: 20px;
      width: 100%;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>TOB SKP</h1>
    <p>Conexión directa vía Web Bluetooth con tu protoboard.</p>

    <button id="btnConectar" class="btn-ble">Conectar Protoboard BLE</button>

    <div id="estado" class="status-box">Estado: Desconectado</div>

    <audio id="reproductorAudio" controls style="display: none;"></audio>
  </div>

  <script>

    const estado = document.getElementById('estado');
    const reproductorAudio = document.getElementById('reproductorAudio');

        return;

        estado.textContent = "Buscando 'TOB SKP'...";
