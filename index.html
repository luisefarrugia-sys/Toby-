<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOB SKP - Receptor de Audio BLE</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    h1 {
      color: #58a6ff;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    p {
      color: #8b949e;
      font-size: 0.95rem;
      line-height: 1.4;
      margin-bottom: 24px;
    }

    .btn-ble {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .btn-ble:hover {
      background-color: #2ea043;
    }

    .btn-ble:disabled {
      background-color: #21262d;
      color: #484f58;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 20px;
      padding: 12px;
      background-color: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      font-size: 0.9rem;
      color: #e3b341;
      word-break: break-word;
    }

    audio {
      margin-top: 20px;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>TOB SKP</h1>
    <p>Conexión directa por Web Bluetooth con tu protoboard.</p>

    <button id="btnConectar" class="btn-ble">Buscar Dispositivos BLE</button>

    <div id="estado" class="status-box">Estado: Desconectado</div>

    <audio id="reproductorAudio" controls style="display: none;"></audio>
  </div>

  <script>
    // UUIDs configurados en el Arduino Nano RP2040 Connect
    const SERVICE_UUID = "19b10000-e8f2-537e-4f6c-d104768a1214";
    const CHARACTERISTIC_UUID = "19b10001-e8f2-537e-4f6c-d104768a1214";

    const btnConectar = document.getElementById('btnConectar');
    const estado = document.getElementById('estado');
    const reproductorAudio = document.getElementById('reproductorAudio');

    let bufferAudio = [];
    let timerFinalizacion = null;

    btnConectar.addEventListener('click', async () => {
      if (!navigator.bluetooth) {
        estado.textContent = "Error: Este navegador no soporta Web Bluetooth. Usa Chrome o Edge.";
        return;
      }

      try {
        estado.textContent = "Selecciona 'TOB SKP' en la lista desplegable...";

        // Acepta todos los dispositivos y especifica el servicio opcional para evitar bloqueos
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: [SERVICE_UUID]
        });

        estado.textContent = `Conectando a ${device.name || 'dispositivo'}...`;
        const server = await device.gatt.connect();

        const service = await server.getPrimaryService(SERVICE_UUID);
        const characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', recibirSegmentoAudio);

        estado.textContent = "¡Conectado exitosamente! Presiona el botón amarillo para grabar.";
        btnConectar.disabled = true;

        device.addEventListener('gattserverdisconnected', () => {
          estado.textContent = "Estado: Desconectado";
          btnConectar.disabled = false;
        });

      } catch (error) {
        console.error("Error BLE:", error);
        estado.textContent = "Conexión cancelada o fallo al conectar. Intenta de nuevo.";
      }
    });

    function recibirSegmentoAudio(event) {
      const bytes = new Uint8Array(event.target.value.buffer);
      
      for (let i = 0; i < bytes.length; i++) {
        bufferAudio.push(bytes[i]);
      }

      estado.textContent = `Recibiendo audio... (${bufferAudio.length} bytes)`;

      clearTimeout(timerFinalizacion);
      timerFinalizacion = setTimeout(procesarAudioRecibido, 500);
    }

    function procesarAudioRecibido() {
      if (bufferAudio.length === 0) return;

      estado.textContent = "Procesando audio...";

      const datosRAW = new Uint8Array(bufferAudio);
      const blobWav = construirEncabezadoWAV(datosRAW, 8000, 1, 8);

      const url = URL.createObjectURL(blobWav);
      reproductorAudio.src = url;
      reproductorAudio.style.display = 'block';
      reproductorAudio.play();

      estado.textContent = "¡Audio recibido! Reproduciendo...";
      bufferAudio = [];
    }

    function construirEncabezadoWAV(datosPCM, frecuenciaMuestreo, canales, bitsPorMuestra) {
      const byteRate = (frecuenciaMuestreo * canales * bitsPorMuestra) / 8;
      const blockAlign = (canales * bitsPorMuestra) / 8;
      const buffer = new ArrayBuffer(44 + datosPCM.length);
      const view = new DataView(buffer);

      escribirTexto(view, 0, 'RIFF');
      view.setUint32(4, 36 + datosPCM.length, true);
      escribirTexto(view, 8, 'WAVE');

      escribirTexto(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, canales, true);
      view.setUint32(24, frecuenciaMuestreo, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPorMuestra, true);

      escribirTexto(view, 36, 'data');
      view.setUint32(40, datosPCM.length, true);

      const salida = new Uint8Array(buffer, 44);
      salida.set(datosPCM);

      return new Blob([buffer], { type: 'audio/wav' });
    }

    function escribirTexto(view, offset, texto) {
      for (let i = 0; i < texto.length; i++) {
        view.setUint8(offset + i, texto.charCodeAt(i));
      }
    }
  </script>
</body>
</html>
